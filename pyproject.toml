[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "cot-assert"
description = "assertion rewriting with a structured AssertionError, for Python 2.7, 3.x and RPython"
readme = "README.md"
keywords = [ "assert", "pytest", "rpython" ]
license = "MPL-2.0"
license-files = [ "LICENSE" ]
authors = [
  { name = "Ronny Pfannschmidt", email = "opensource@ronnypfannschmidt.de" },
]
# 2.7 is supported from source (PYTHONPATH) and the py2.py3 wheel; hatchling
# itself needs a modern Python to build.
requires-python = ">=2.7,!=3.0.*,!=3.1.*,!=3.2.*,!=3.3.*,!=3.4.*,!=3.5.*,!=3.6.*,!=3.7.*,!=3.8.*"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 2",
  "Programming Language :: Python :: 2.7",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dynamic = [ "version" ]
dependencies = []
# inactive until enabled with --cot-assert or the cot_assert ini option
entry-points.pytest11.cot_assert = "cot_assert.pytest_plugin"

[dependency-groups]
test = [
  "hypothesis>=6",
  "pytest>=8.3; python_version<'3.10'",
  "pytest>=9; python_version>='3.10'",
]
lint = [
  "ruff>=0.5",
]

[tool.hatch]
version.source = "vcs"
# the repository has no commits yet; drop once it is tagged
version.raw-options.fallback_version = "0.0.0"
build.targets.wheel.packages = [ "src/cot_assert" ]
build.targets.sdist.exclude = [
  "/.claude",
  "/.containers",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/dist",
]

[tool.uv]
default-groups = [ "test", "lint" ]
# 2.7 runs in containers (testing/containers.sh), not in uv environments
environments = [ "python_version>='3.9'" ]

[tool.ruff]
# The source must stay valid Python 2.7; py37 is ruff's floor, and pyupgrade
# is off because every rewrite it proposes is a py2 syntax error.
target-version = "py37"
line-length = 88
src = [ "src", "testing" ]
# vendored from pytest as it is, so that a resync stays a copy
extend-exclude = [ "testing/test_rewrite_coverage.py" ]
lint.select = [
  "B", # flake8-bugbear
  "E", # pycodestyle errors
  "F", # pyflakes
  "I", # isort
  "W", # pycodestyle warnings
]
lint.isort.known-first-party = [ "cot_assert" ]

[tool.pyproject-fmt]
# it cannot read a requires-python that includes 2.7, and would classify the
# package as "3 :: Only"
generate_python_version_classifiers = false

[tool.pytest]
ini_options.testpaths = [ "testing" ]
