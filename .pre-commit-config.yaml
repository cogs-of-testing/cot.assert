repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.1
  hooks:
    - id: ruff-check
      args: [ --fix ]
    - id: ruff-format

- repo: https://github.com/woodruffw/zizmor-pre-commit
  rev: v1.28.0
  hooks:
    - id: zizmor

- repo: https://github.com/tox-dev/pyproject-fmt
  rev: "v2.26.0"
  hooks:
    - id: pyproject-fmt
